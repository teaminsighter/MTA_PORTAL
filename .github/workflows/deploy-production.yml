name: Deploy production

# Fires on a version tag (v1.0.0, v0.4.2, etc). The `if` gate keeps
# the job disabled until Sean's Cloudflare account is wired and the
# production D1 exists. Flip DEPLOY_PRODUCTION_ENABLED to 'true' in
# the repo variables to re-enable.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://portal.mytopagent.co.nz
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from package.json "packageManager".
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint / typecheck / test (belt-and-braces)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:production

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:production

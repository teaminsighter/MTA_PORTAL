name: Deploy demo

# Auto-deploys the DEMO environment to a Cloudflare Worker on every
# push to main. No CI dependency — demo is throwaway; if something
# breaks Sean sees it, we fix and push again. Demo mode reads mock
# JSON so no D1 or secrets are needed beyond the Cloudflare API
# token and account id.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: demo
      url: https://mta-portal-demo.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from package.json "packageManager". Setting
        # `version` here as well would conflict.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker (demo env)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:demo
